name: Build

# Compila los plugins y publica los .cs3 + plugins.json en la rama "builds"
on:
  push:
    branches-ignore:
      - builds
    paths-ignore:
      - "*.md"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          path: src

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar plugins
        working-directory: src
        run: gradle make makePluginsJson

      - name: Publicar en la rama builds
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch builds "$REMOTE" builds; then
            echo "Rama builds encontrada"
          else
            mkdir builds && cd builds && git init -q && git checkout -q --orphan builds \
              && git remote add origin "$REMOTE" && cd ..
          fi
          cd builds
          rm -f *.cs3 plugins.json
          cp ../src/*/build/*.cs3 .
          cp ../src/build/plugins.json .
          cp ../src/repo.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build $GITHUB_SHA" || echo "Sin cambios"
          git push -q origin HEAD:builds
