name: Build

# Compila los plugins y publica los .cs3 + plugins.json + repo.json en la rama "builds"
on:
  push:
    branches-ignore:
      - builds
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar plugins
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson ensureJarCompatibility

      - name: Preparar distribución
        run: |
          mkdir -p dist
          cp */build/*.cs3 dist/
          cp */build/*.jar dist/ 2>/dev/null || true
          cp build/plugins.json dist/
          cp repo.json dist/
          test -s dist/plugins.json
          test -s dist/Zafiro.cs3

      - uses: actions/upload-artifact@v4
        with:
          name: zafiro-cloudstream
          path: dist/

      - name: Publicar en la rama builds
        run: |
          git fetch origin builds || true
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add publication origin/builds
            git -C publication checkout -B builds origin/builds
          else
            git worktree add --detach publication
            git -C publication checkout --orphan builds
            git -C publication rm -rf . || true
          fi
          git -C publication ls-files -z | xargs -0 -r -I '{}' rm -f -- "publication/{}"
          cp dist/* publication/
          git -C publication config user.name "github-actions[bot]"
          git -C publication config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publication add -A
          git -C publication commit -m "Compilación automática $GITHUB_SHA" || exit 0
          git -C publication push origin HEAD:builds
